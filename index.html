<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汪汪救援隊：狗場體重抽樣大挑戰 | M1 統計分佈模擬器</title>

  <!-- 1. 第三方 CSS 框架 (Bootstrap 5 & FontAwesome 圖標) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- 2. 引用自訂樣式表 (相對路徑) -->
  <link rel="stylesheet" href="style.css">

  <!-- 3. 第三方 JavaScript 庫 (Chart.js & Firebase 核心庫) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- 主容器 -->
  <div class="container py-4">
    
    <!-- 頁面標題區 -->
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">
        <i class="fa-solid => fa-dog me-2"></i>汪汪救援隊：狗場體重抽樣大挑戰
      </h2>
      <p class="text-muted fs-6">
        中六級 數學延伸部分（單元一）— 13.2 樣本平均值的抽樣分佈 $E(\bar{X}) = \mu$ 與 $Var(\bar{X}) = \frac{\sigma^2}{n}$ 實證探究
      </p>
    </div>

    <!-- 頂部：小組抽樣控制面板 -->
    <div class="card bg-white p-3 mb-4 shadow-sm">
      <div class="row g-3 align-items-center">
        <!-- 選取組別 -->
        <div class="col-md-3">
          <label for="select-group" class="form-label fw-bold">
            <i class="fa-solid fa-users text-primary me-1"></i>選擇組別：
          </label>
          <select id="select-group" class="form-select">
            <option value="">-- 請選擇組別 --</option>
            <option value="1">第 1 組</option>
            <option value="2">第 2 組</option>
            <option value="3">第 3 組</option>
            <option value="4">第 4 組</option>
            <option value="5">第 5 組</option>
            <option value="6">第 6 組</option>
          </select>
        </div>

        <!-- 目標抽樣數 n -->
        <div class="col-md-3">
          <label for="select-n" class="form-label fw-bold">
            <i class="fa-solid fa-hashtag text-primary me-1"></i>目標樣本數 (n)：
          </label>
          <select id="select-n" class="form-select">
            <option value="2">n = 2 (第 1-2 組)</option>
            <option value="5">n = 5</option>
            <option value="10" selected>n = 10 (第 3-4 組)</option>
            <option value="20">n = 20</option>
            <option value="30">n = 30 (第 5-6 組)</option>
            <option value="100">n = 100</option>
          </select>
        </div>

        <!-- 抽樣機制 -->
        <div class="col-md-3">
          <label for="select-method" class="form-label fw-bold">
            <i class="fa-solid fa-arrows-rotate text-primary me-1"></i>抽樣機制：
          </label>
          <select id="select-method" class="form-select">
            <option value="replacement">放回抽樣 (With Replacement)</option>
            <option value="no_replacement">不放回抽樣 (Without Replacement)</option>
          </select>
        </div>

        <!-- 執行按鈕 -->
        <div class="col-md-3 d-grid">
          <label class="form-label opacity-0 d-none d-md-block">操作</label>
          <button id="btn-run-sample" class="btn btn-primary fw-bold py-2">
            <i class="fa-solid fa-play me-1"></i>🚀 執行單次抽樣
          </button>
        </div>
      </div>
    </div>

    <!-- 主要工作區 (雙欄佈局) -->
    <div class="row g-4">
      
      <!-- 左欄：本組 10 次抽樣歷史與統計小結 -->
      <div class="col-lg-5">
        <div class="card h-100 shadow-sm">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
            <h6 class="mb-0 fw-bold">
              <i class="fa-solid fa-clipboard-list me-2"></i>小組獨立抽樣紀錄表
            </h6>
            <button id="btn-reset-history" class="btn btn-sm btn-outline-light">
              <i class="fa-solid fa-rotate-left me-1"></i>重置本組
            </button>
          </div>
          <div class="card-body d-flex flex-column justify-content-between">
            <!-- 歷史數據表格 -->
            <div class="table-responsive mb-3" style="max-height: 280px;">
              <table class="table table-hover align-middle text-center">
                <thead class="table-light sticky-top">
                  <tr>
                    <th>抽樣次數 ($i$)</th>
                    <th>樣本平均體重 $\bar{x}_i$ (kg)</th>
                  </tr>
                </thead>
                <tbody id="history-tbody">
                  <tr>
                    <td colspan="2" class="text-muted py-4">尚無紀錄，請先選擇組別並點擊執行抽樣</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- 本組實測統計數據卡片 -->
            <div>
              <h6 class="fw-bold text-secondary mb-2">
                <i class="fa-solid fa-calculator me-1"></i>工作紙填寫統計數據：
              </h6>
              <div class="row g-2">
                <div class="col-6">
                  <div class="stat-card">
                    <div class="stat-title">已完成抽樣
